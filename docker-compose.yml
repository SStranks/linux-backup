# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
---
services:
  # DB: MongoDB
  mongo:
    container_name: ${MONGO_CONTAINER}
    image: mongo:8.0.10
    restart: no
    env_file:
      - ./.env
    ports:
      - $MONGODB_LOCAL_PORT:$MONGODB_DOCKER_PORT
    volumes:
      - ./mongodump.sh:/tmp/mongodump.sh:ro
      - mongodb-data:/data/db
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges
    read_only: true
    cap_drop:
      - ALL
    secrets:
      - mongo_user_service
      - mongo_password_service

volumes:
  mongo-data:
    name: mongo-data
    external: true

secrets:
  mongo_user_service:
    file: ${SECRET_PATH}/.secret.mongo_user_service.txt
  mongo_password_service:
    file: ${SECRET_PATH}/.secret.mongo_password_service.txt
